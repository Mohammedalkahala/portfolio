<style>
  :root{

    --live:#34d399; --progress:#fbbf24; --planned:#60a5fa; --future:#a78bfa; --accent:#c084fc;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px}
  header{padding:18px 24px 10px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line)}
  h1{font-size:20px;font-weight:600;margin:0;letter-spacing:.2px}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .stats{display:flex;gap:14px;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:12px;color:var(--muted)}
  .stat b{font-size:16px;color:var(--text);margin-right:6px;font-weight:600}
  .toolbar{padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;border-bottom:1px solid var(--line)}
  .group{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .group label{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin-right:4px}
  button.chip{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font:500 12px Inter,sans-serif;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
  button.chip:hover{border-color:#3a4560}
  button.chip.on{background:#1d2436;border-color:var(--accent)}
  button.chip.off{opacity:.4}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  main{display:grid;grid-template-columns:minmax(0,1fr) 370px;min-height:calc(100vh - 140px)}
  #stage{position:relative;overflow:auto;padding:10px}
  svg{width:100%;height:auto;display:block;min-width:900px}
  aside{border-left:1px solid var(--line);background:var(--panel);padding:18px 20px;overflow:auto;max-height:calc(100vh - 140px);position:sticky;top:0}
  aside h2{font-size:17px;margin:0 0 4px;font-weight:600}
  aside .kicker{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
  aside p{color:#c3c9d6;line-height:1.55;margin:8px 0}
  aside ul,aside ol{padding-left:18px;margin:8px 0;color:#c3c9d6;line-height:1.55}
  aside li{margin:4px 0}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid;margin-right:6px;font-weight:500}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:13px;margin:10px 0}
  .kv div:nth-child(odd){color:var(--dim)}
  .mono{font-family:"JetBrains Mono",monospace;font-size:12px}
  .conn{font-size:12.5px;color:#c3c9d6;margin:3px 0}
  .conn b{color:var(--text);font-weight:500}
  .phases{padding:12px 24px 22px;border-top:1px solid var(--line)}
  .phases .row{display:flex;gap:8px;flex-wrap:wrap}
  .phase{flex:1 1 140px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;min-width:140px}
  .phase:hover{border-color:#3a4560}
  .phase.on{border-color:var(--accent);background:#1a2032}
  .phase .t{font-weight:600;font-size:13px}
  .phase .d{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.4}
  .phase .bar{height:4px;border-radius:4px;margin-top:8px;background:var(--line);overflow:hidden}
  .phase .bar i{display:block;height:100%}
  .tip{position:fixed;pointer-events:none;background:#0f1422;border:1px solid #2c3550;border-radius:8px;padding:7px 10px;font-size:12px;max-width:260px;color:#d7dceb;display:none;z-index:5;box-shadow:0 6px 24px rgba(0,0,0,.4)}
  .hint{color:var(--dim);font-size:12px}
  .node{cursor:pointer}
  .node rect.card{transition:opacity .2s}
  .faded{opacity:.14}
  .edge{fill:none;stroke:#3b4660;stroke-width:1.3;transition:opacity .2s, stroke .2s}
  .edge.hot{stroke-width:2.2}
  .edge.anim{stroke-dasharray:6 6;animation:flow 1.1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-24}}
  @media (prefers-reduced-motion: reduce){.edge.anim{animation:none}}
  .elabel{font:500 10.5px Inter,sans-serif;fill:#e9ecf5}
  .elabel-bg{fill:#0d1220;stroke:#2c3550}
  .steps li{margin:6px 0}
  .steps li.cur{color:var(--text)}
  @media (max-width: 980px){main{grid-template-columns:1fr}aside{border-left:none;border-top:1px solid var(--line);max-height:none;position:static}}
</style>
</head>

    "On Approve, the rule is committed to GitHub with its case and grade."]},
  {id:"test", t:"Attack & grade", color:"#f472b6", steps:[
    "You ask the Planner what to test; it posts a plan to #test-plans.",
    "Kali (Caldera / manual) or Atomic tests from loop attack office01 or linux01.",
    "office01's Sysmon and Security logs flow to Wazuh.",
    "Grade & Review checks which rules fired and explains PASS/FAIL in #grades."]},
  {id:"telemetry", t:"Telemetry → SIEM", color:"#34d399", steps:[
    "Every endpoint runs a Wazuh agent: dc01, office01, linux01, files, ops01.",
    "OPNsense ships Suricata IDS alerts.",
    "In progress: Proxmox host and Kali. Planned: GPU PC and office02 (baked into the template).",
    "Phase 2: M365 / Entra ID and AWS (CloudTrail, GuardDuty) feed the same SIEM."]},
  {id:"triage", t:"SOC triage", color:"#fbbf24", steps:[
    "Wazuh raises level-10+ alerts.",
    "Every 5 minutes the SOC triage agent investigates them.",
    "It posts a verdict with evidence to #soc-triage."]},
  {id:"ops", t:"ops01 agent", color:"#60a5fa", steps:[
    "You give orders and approve from claude.ai/code.",
    "ops01 builds VMs only inside its Proxmox pool, and changes the firewall only through fw-apply.",
    "It reads logs on every machine with no admin rights.",
    "Every action is posted to Discord and logged to Wazuh; a blocked action is a level-10 alert.",
    "Next: clone the golden template into office02, join it with ad-join, snapshot it."]},
  {id:"daily", t:"Daily report", color:"#38bdf8", steps:[
    "At 07:41 the Ops assistant pulls 24h of alerts from Wazuh and account state from AD.",
    "It writes a plain-language health report to #amana-ops."]},
  {id:"public", t:"Build in public", color:"#a78bfa", steps:[
    "Approved detections land in the GitHub repo with receipts.",
    "Company-sourced detections reproduce a Huntress or Red Canary post in the lab.",
    "Obsidian turns the repo into notes and dashboards; Quartz publishes the site.",
    "Later: the same rules tested in Splunk, Sumo Logic and Huntress; a public feed and the PurpleLoop MCP."]},
];

// ---------- rendering ----------
const svg = document.getElementById('map');
const NS = 'http://www.w3.org/2000/svg';
const byId = Object.fromEntries(N.map(n => [n.id, n]));
N.forEach(n => { n.w = n.w || 168; n.h = n.h || 66; n.cx = n.x + n.w/2; n.cy = n.y + n.h/2; });

function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

const defs = el('defs', {}, svg);
Object.entries({def:'#4b5674'}).concat(FLOWS.map(f => [f.id, f.color])).concat(Object.entries(STATUS).map(([k,v]) => ['s'+k, v.hex])).forEach(([k,c]) => {
  const m = el('marker', {id:'ar-'+k, viewBox:'0 0 10 10', refX:'9', refY:'5', markerWidth:'7', markerHeight:'7', orient:'auto-start-reverse'}, defs);
  el('path', {d:'M0,0 L10,5 L0,10 z', fill:c}, m);
});

const gZones = el('g', {}, svg), gEdges = el('g', {}, svg), gNodes = el('g', {}, svg), gLabels = el('g', {}, svg);

ZONES.forEach(z => {
  el('rect', {x:z.x, y:z.y, width:z.w, height:z.h, rx:16, fill:z.tint, stroke:'#26304a', 'stroke-width':1}, gZones);
  const t = el('text', {x:z.x+16, y:z.y+24, fill:'#cfd5e4', 'font-size':13, 'font-weight':600, 'font-family':'Inter'}, gZones); t.textContent = z.title;
  const s = el('text', {x:z.x+16 + z.title.length*7.6 + 10, y:z.y+24, fill:'#7f88a0', 'font-size':11, 'font-family':'JetBrains Mono'}, gZones); s.textContent = z.sub;
});
// agents sub-label in SOC
(() => { const t = el('text', {x:466, y:552, fill:'#7f88a0', 'font-size':11, 'font-family':'Inter'}, gZones); t.textContent = 'n8n AI agents (run on loop)'; })();

function clip(n, dx, dy){ // point on rect border towards (dx,dy)
  const hw = n.w/2 + 3, hh = n.h/2 + 3;
  const t = Math.min(dx ? hw/Math.abs(dx) : Infinity, dy ? hh/Math.abs(dy) : Infinity);
  return [n.cx + dx*t, n.cy + dy*t];
}
const edgeEls = [];
E.forEach(([a,b,label,flows,st]) => {
  const A = byId[a], B = byId[b]; if (!A || !B) return;
  const dx = B.cx - A.cx, dy = B.cy - A.cy;
  const [x1,y1] = clip(A, dx, dy), [x2,y2] = clip(B, -dx, -dy);
  const len = Math.hypot(x2-x1, y2-y1) || 1;
  const flat = Math.abs(dy) < 30 && Math.abs(dx) > 200;   // same row, other nodes in between: arc over them
  const bend = flat ? Math.min(130, len*0.3) * (dx > 0 ? -1 : 1) : Math.min(40, len*0.12);
  const mx = (x1+x2)/2 - (y2-y1)/len*bend, my = (y1+y2)/2 + (x2-x1)/len*bend;
  const p = el('path', {d:`M${x1},${y1} Q${mx},${my} ${x2},${y2}`, class:'edge', 'marker-end':'url(#ar-def)'}, gEdges);
  const status = st || 'live';
  if (status !== 'live') p.setAttribute('stroke-dasharray', STATUS[status].dash || '5 4');
  // label position at t=0.5 on the quad curve
  const lx = 0.25*x1 + 0.5*mx + 0.25*x2, ly = 0.25*y1 + 0.5*my + 0.25*y2;
  edgeEls.push({a, b, label, flows, status, p, lx, ly});
});

const nodeEls = {};
N.forEach(n => {
  const g = el('g', {class:'node', tabindex:0, role:'button', 'aria-label': n.label + ' — ' + STATUS[n.s].label}, gNodes);
  const st = STATUS[n.s];
  el('rect', {class:'card', x:n.x, y:n.y, width:n.w, height:n.h, rx:12, fill:'#121828', stroke:st.hex, 'stroke-width':1.6, 'stroke-dasharray':st.dash, 'stroke-opacity': n.s==='live'?0.55:0.9}, g);
  el('rect', {x:n.x, y:n.y+10, width:3.5, height:n.h-20, rx:2, fill:st.hex}, g);
  if (n.vertical){
    const t = el('text', {x:n.cx, y:n.cy-10, 'text-anchor':'middle', fill:'#eef1f8', 'font-size':15, 'font-weight':600, 'font-family':'Inter', transform:`rotate(-90 ${n.cx} ${n.cy})`}, g); t.textContent = n.label + ' firewall';
    const s = el('text', {x:n.cx, y:n.cy+12, 'text-anchor':'middle', fill:'#8a93a8', 'font-size':11, 'font-family':'Inter', transform:`rotate(-90 ${n.cx} ${n.cy})`}, g); s.textContent = 'Suricata · WireGuard · fw-apply';
  } else {
    const t = el('text', {x:n.x+14, y:n.y + (n.h>60?27:24), fill:'#eef1f8', 'font-size': n.w<130?12.5:14, 'font-weight':600, 'font-family':'Inter'}, g); t.textContent = n.label;
    const s = el('text', {x:n.x+14, y:n.y + (n.h>60?46:42), fill:'#8a93a8', 'font-size':11, 'font-family':'Inter'}, g); s.textContent = n.sub;
    if (n.ip && n.w >= 160){ const ip = el('text', {x:n.x+n.w-10, y:n.y+n.h-9, 'text-anchor':'end', fill:'#5b6479', 'font-size':9.5, 'font-family':'JetBrains Mono'}, g); ip.textContent = n.ip.split(' ')[0]; }
  }
  g.addEventListener('click', () => selectNode(n.id));
  g.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' '){ e.preventDefault(); selectNode(n.id);} });
  g.addEventListener('mousemove', e => showTip(e, `<b>${n.label}</b> · <span style="color:${st.hex}">${st.label}</span><br>${n.sub}`));
  g.addEventListener('mouseleave', hideTip);
  nodeEls[n.id] = g;
});

// ---------- state ----------
let activeFlow = null, activeNode = null, activePhase = null;
const shown = {live:true, progress:true, planned:true, future:true};

function clearLabels(){ while (gLabels.firstChild) gLabels.removeChild(gLabels.firstChild); }
function addLabel(e, color){
  if (!e.label) return;
  const w = e.label.length*5.9 + 12;
  el('rect', {x:e.lx - w/2, y:e.ly - 9, width:w, height:17, rx:8, class:'elabel-bg', stroke: color||'#2c3550'}, gLabels);
  const t = el('text', {x:e.lx, y:e.ly+3.5, 'text-anchor':'middle', class:'elabel'}, gLabels); t.textContent = e.label;
}

function render(){
  clearLabels();
  const flow = FLOWS.find(f => f.id === activeFlow);
  let litNodes = null;
  if (flow){ litNodes = new Set(); edgeEls.forEach(e => { if (e.flows.includes(flow.id)) { litNodes.add(e.a); litNodes.add(e.b); } }); }
  if (activeNode){ litNodes = new Set([activeNode]); edgeEls.forEach(e => { if (e.a===activeNode || e.b===activeNode) { litNodes.add(e.a); litNodes.add(e.b); } }); }
  if (activePhase){ litNodes = new Set(N.filter(n => n.ph === activePhase).map(n => n.id)); }

  N.forEach(n => {
    const visible = shown[n.s];
    const dim = !visible || (litNodes && !litNodes.has(n.id));
    nodeEls[n.id].classList.toggle('faded', dim);
    nodeEls[n.id].style.display = '';
  });
  edgeEls.forEach(e => {
    const endsVisible = shown[byId[e.a].s] && shown[byId[e.b].s] && shown[e.status];
    let hot = false, color = null;
    if (flow && e.flows.includes(flow.id)) { hot = true; color = flow.color; }
    if (activeNode && (e.a===activeNode || e.b===activeNode)) { hot = true; color = '#e2e8f0'; }
    if (activePhase && byId[e.a].ph===activePhase && byId[e.b].ph===activePhase) { hot = true; color = '#c084fc'; }
    const anyFocus = flow || activeNode || activePhase;
    e.p.classList.toggle('hot', hot);
    e.p.classList.toggle('anim', hot);
    e.p.style.stroke = hot ? color : (e.status!=='live' ? STATUS[e.status].hex : '');
    e.p.style.opacity = !endsVisible ? 0.05 : (anyFocus ? (hot ? 1 : 0.07) : (e.status==='live' ? 0.55 : 0.45));
    const mk = hot ? (flow && e.flows.includes(flow.id) ? flow.id : 'def') : (e.status!=='live' ? 's'+e.status : 'def');
    e.p.setAttribute('marker-end', `url(#ar-${mk})`);
    if (hot && endsVisible) addLabel(e, color);
  });
  document.querySelectorAll('#flowBtns .chip').forEach(b => b.classList.toggle('on', b.dataset.id === activeFlow));
  document.querySelectorAll('.phase').forEach(p => p.classList.toggle('on', p.dataset.id === activePhase));
}

// ---------- panel ----------
const panel = document.getElementById('panel');
function badge(s){ const st = STATUS[s]; return `<span class="badge" style="color:${st.hex};border-color:${st.hex}55">${st.label}</span>`; }
function phaseName(id){ const p = PHASES.find(p => p.id===id); return p ? p.t : id; }

function overview(){
  const legend = Object.entries(STATUS).map(([k,v]) => `<div class="conn"><span class="dot" style="background:${v.hex}"></span> <b>${v.label}</b> ${k==='live'?'— running today':k==='progress'?'— being set up now':k==='planned'?'— on the roadmap (dashed)':'— later phases (dotted)'}</div>`).join('');
  panel.innerHTML = `
    <div class="kicker">Overview</div>
    <h2>How the lab fits together</h2>
    <p>A Proxmox homelab split into zones by OPNsense. Endpoints feed <b>Wazuh</b>; AI agents on <b>loop</b> turn new CVEs into detections, test them with real attacks and grade them; the <b>ops01</b> Claude Code agent operates the lab behind guardrails; results land in Discord and GitHub, and later in the cloud, a public feed and other SIEMs.</p>
    ${legend}
    <p class="hint" style="margin-top:14px">Click a box for details and its connections · pick a flow above to watch data move · click a roadmap phase below to see what it adds.</p>
    <div class="kicker" style="margin-top:16px">Today's headline</div>
    <ul>
      <li>ops01 agent reads every machine with no admin rights</li>
      <li>SOC firewall hardened by the agent (14 explicit flows)</li>
      <li>Wazuh watches the agent: blocked action = level-10 alert</li>
      <li>Next: Wazuh agents everywhere → golden template → office02</li>
    </ul>`;
}

function selectNode(id){
  activeFlow = null; activePhase = null;
  activeNode = activeNode === id ? null : id;
  if (!activeNode){ overview(); render(); return; }
  const n = byId[id];
  const outs = edgeEls.filter(e => e.a===id), ins = edgeEls.filter(e => e.b===id);
  const line = (e, dir) => `<div class="conn">${dir==='out'?'→':'←'} <b>${byId[dir==='out'?e.b:e.a].label}</b>${e.label?` <span style="color:var(--muted)">· ${e.label}</span>`:''}${e.status!=='live'?' '+badge(e.status):''}</div>`;
  panel.innerHTML = `
    <div class="kicker">${(ZONES.find(z=>z.id===n.z)||{title:'Firewall'}).title}</div>
    <h2>${n.label}</h2>
    <div style="margin:6px 0 4px">${badge(n.s)}<span class="hint">${phaseName(n.ph)}</span></div>
    <p>${n.role}</p>
    <div class="kv">
      ${n.ip ? `<div>Address</div><div class="mono">${n.ip}</div>` : ''}
      <div>Does</div><div>${n.sub}</div>
      ${n.extra ? `<div>Note</div><div>${n.extra}</div>` : ''}
    </div>
    ${outs.length ? `<div class="kicker" style="margin-top:12px">Sends to</div>${outs.map(e=>line(e,'out')).join('')}` : ''}
    ${ins.length ? `<div class="kicker" style="margin-top:12px">Receives from</div>${ins.map(e=>line(e,'in')).join('')}` : ''}
    <p class="hint" style="margin-top:14px">Click it again (or empty space) to reset.</p>`;
  render();
}

function selectFlow(id){
  activeNode = null; activePhase = null;
  activeFlow = activeFlow === id ? null : id;
  if (!activeFlow){ overview(); render(); return; }
  const f = FLOWS.find(f => f.id===id);
  panel.innerHTML = `<div class="kicker">Flow</div><h2 style="color:${f.color}">${f.t}</h2><ol class="steps">${f.steps.map(s=>`<li>${s}</li>`).join('')}</ol><p class="hint">Animated arrows on the map follow this flow. Dashed = planned.</p>`;
  render();
}

function selectPhase(id){
  activeNode = null; activeFlow = null;
  activePhase = activePhase === id ? null : id;
  if (!activePhase){ overview(); render(); return; }
  const p = PHASES.find(p => p.id===id); const parts = N.filter(n => n.ph===id);
  panel.innerHTML = `<div class="kicker">Roadmap</div><h2>${p.t}</h2><p>${p.d}</p><div class="kicker" style="margin-top:12px">Parts (${parts.length})</div>${parts.map(n=>`<div class="conn">${badge(n.s)}<b>${n.label}</b> <span style="color:var(--muted)">· ${n.sub}</span></div>`).join('')}`;
  render();
}

svg.addEventListener('click', e => { if (e.target === svg || e.target.parentNode === gZones) { activeNode = activeFlow = activePhase = null; overview(); render(); } });

// ---------- toolbar, stats, phases ----------
const fb = document.getElementById('flowBtns');
FLOWS.forEach(f => { const b = document.createElement('button'); b.className='chip'; b.dataset.id=f.id; b.innerHTML = `<span class="dot" style="background:${f.color}"></span>${f.t}`; b.onclick = () => selectFlow(f.id); fb.appendChild(b); });
const sb = document.getElementById('statusBtns');
Object.entries(STATUS).forEach(([k,v]) => { const b = document.createElement('button'); b.className='chip'; b.innerHTML = `<span class="dot" style="background:${v.hex}"></span>${v.label}`; b.onclick = () => { shown[k] = !shown[k]; b.classList.toggle('off', !shown[k]); render(); }; sb.appendChild(b); });

const counts = {}; N.forEach(n => counts[n.s] = (counts[n.s]||0)+1);
document.getElementById('stats').innerHTML = Object.entries(STATUS).map(([k,v]) => `<div class="stat"><b style="color:${v.hex}">${counts[k]||0}</b>${v.label}</div>`).join('') + `<div class="stat"><b>${FLOWS.length}</b>flows</div>`;

const pr = document.getElementById('phaseRow');
PHASES.forEach(p => {
  const parts = N.filter(n => n.ph===p.id); const live = parts.filter(n => n.s==='live').length; const prog = parts.filter(n => n.s==='progress').length;
  const pct = parts.length ? Math.round((live + prog*0.5)/parts.length*100) : 0;
  const d = document.createElement('div'); d.className='phase'; d.dataset.id=p.id; d.tabIndex=0;
  d.innerHTML = `<div class="t">${p.t}</div><div class="d">${p.d}</div><div class="bar"><i style="width:${pct}%;background:${pct===100?'#34d399':pct>0?'#fbbf24':'#3b4660'}"></i></div>`;
  d.onclick = () => selectPhase(p.id); d.onkeydown = e => { if (e.key==='Enter') selectPhase(p.id); };
  pr.appendChild(d);
});

// ---------- tooltip ----------
const tip = document.getElementById('tip');
function showTip(e, html){ tip.innerHTML = html; tip.style.display='block'; tip.style.left = Math.min(e.clientX+14, innerWidth-280)+'px'; tip.style.top = (e.clientY+14)+'px'; }
function hideTip(){ tip.style.display='none'; }

overview(); render();
</script>
</body>
</html>
